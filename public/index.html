<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game - PL-3 Mini Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="classic">
  <div class="game-container">
    <!-- Header -->
    <header class="game-header">
      <div class="logo">
        <span class="snake-icon">🐍</span>
        <h1>SNAKE</h1>
      </div>

      <div class="score-board">
        <div class="badge score-badge">
          <span class="badge-label">SCORE</span>
          <span id="score" class="badge-val">0</span>
        </div>
        <div class="badge high-score-badge">
          <span class="badge-label">HIGH SCORE</span>
          <span id="high-score" class="badge-val">0</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="pause-btn" class="btn btn-action" type="button">Pause</button>
        <button id="restart-btn" class="btn btn-action btn-danger" type="button">Restart</button>
      </div>
    </header>

    <!-- Canvas Arena -->
    <main class="board-wrapper">
      <div class="canvas-card">
        <canvas id="game-canvas" width="650" height="650"></canvas>

        <!-- Overlay for Game Over & Pause -->
        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h2 id="overlay-title">GAME OVER</h2>
            <div class="overlay-score-info">
              <p id="overlay-score-msg">Final Score: 0</p>
              <p id="overlay-sub-msg">Best Score: 0</p>
            </div>
            <button id="overlay-btn" class="btn btn-primary" type="button">Play Again [R]</button>
          </div>
        </div>
        <!-- Mobile Virtual D-Pad -->
        <div class="mobile-controls" id="mobile-dpad">
          <div class="dpad-row">
            <button class="dpad-btn" id="dpad-up" aria-label="Up">▲</button>
          </div>
          <div class="dpad-row dpad-middle">
            <button class="dpad-btn" id="dpad-left" aria-label="Left">◀</button>
            <div class="dpad-center"></div>
            <button class="dpad-btn" id="dpad-right" aria-label="Right">▶</button>
          </div>
          <div class="dpad-row">
            <button class="dpad-btn" id="dpad-down" aria-label="Down">▼</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Settings & Controls -->
    <footer class="game-footer">
      <div class="settings-group">
        <div class="control-field">
          <label for="theme-select">🎨 Theme:</label>
          <select id="theme-select" class="dropdown">
            <option value="classic">Neon Matrix</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="retro">Retro Green Arcade</option>
            <option value="ocean">Deep Ocean</option>
            <option value="light">Modern Light</option>
          </select>
        </div>

        <div class="control-field">
          <label for="speed-select">⚡ Speed:</label>
          <select id="speed-select" class="dropdown">
            <option value="very_slow">Very Slow</option>
            <option value="slow">Slow</option>
            <option value="medium" selected>Medium (Normal)</option>
            <option value="fast">Fast</option>
            <option value="insane">Insane</option>
          </select>
        </div>
      </div>

      <!-- Controls Guide -->
      <div class="tips">
        <span>Controls: <strong>W/A/S/D</strong> or <strong>Arrow Keys</strong> | <strong>Space / P</strong>: Pause | <strong>R</strong>: Restart</span>
      </div>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
